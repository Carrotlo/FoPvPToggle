# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
tokens:
  prefix: ":iron_sword: {theme}FoPvPToggle &8» {muted}"
  theme: "&#03fc88"
  muted: "&#a7b8b0"
  white: "&#ffffff"
  good: "&#3ecf8e"
  bad: "&#ff5d73"

no-permission: "{prefix}{bad}You do not have permission."
player-only: "{prefix}{bad}This command is in-game only."
usage-toggle: "{prefix}{muted}Usage: {white}/{label} [on|off|status]"
usage-admin: "{prefix}{muted}Usage: {white}/{label} <version|reload|editor>"
pvp-enabled: "{prefix}{good}PvP enabled. {muted}You can damage players and players can damage you."
pvp-disabled: "{prefix}{bad}PvP disabled. {muted}Player damage is blocked both ways."
pvp-override-active: "{prefix}{good}PvP is forced on by an admin event override."
pvp-override-denied: "{prefix}{bad}You cannot disable /pvp while admin event override is enabled."
pvp-world-disabled: "{prefix}{bad}/pvp is disabled in this world. PvP is always enabled here."
pvp-temporary-forced: "{prefix}{bad}PvP is temporarily required by another plugin."
pvp-change-cancelled: "{prefix}{bad}You cannot change PvP right now."
pvp-change-unavailable: "{prefix}{bad}PvP cannot be changed right now."
damage-blocked: "{prefix}{bad}Damage blocked because /pvp is disabled."
pvp-status-enabled: "{prefix}{muted}PvP status: {good}enabled"
pvp-status-disabled: "{prefix}{muted}PvP status: {bad}disabled"
pvp-status-override: "{prefix}{muted}PvP status: {good}enabled {muted}(admin override active)"
pve-protection-active: "{prefix}{muted}PvE protection is also active."
reload-success: "{prefix}:emerald: {good}Config, messages, and editor settings reloaded."
reload-failed: "{prefix}:redstone: {bad}Reload failed at {white}{step}{bad}: {muted}{error}"
editor-opened: "{prefix}:book: {good}Editor opened."
setting-saved: "{prefix}:emerald: {good}Saved {white}{setting}{good}: {white}{value}"
worlds-opened: "{prefix}:grass_block: {good}World selector opened."
world-added: "{prefix}:grass_block: {good}Added disabled world: {white}{world}"
world-removed: "{prefix}:barrier: {good}Removed disabled world: {white}{world}"
regions-opened: "{prefix}:map: {good}Region browser opened."
region-added: "{prefix}:emerald: {good}Added forced PvP region: {white}{region}"
region-removed: "{prefix}:barrier: {good}Removed forced PvP region: {white}{region}"
region-worldguard-missing: "{prefix}{bad}WorldGuard is not installed or not enabled."
region-toggle-denied: "{prefix}{bad}You cannot disable /pvp inside this WorldGuard region."
region-pvp-forced-enabled: "{prefix}{good}PvP was forced on for you in this region."
region-search-applied: "{prefix}{good}Region search applied: {white}{query}"
region-search-cleared: "{prefix}{good}Region search cleared."
world-search-applied: "{prefix}{good}World search applied: {white}{query}"
world-search-cleared: "{prefix}{good}World search cleared."
prompt-cancelled: "{prefix}{bad}Input cancelled."
